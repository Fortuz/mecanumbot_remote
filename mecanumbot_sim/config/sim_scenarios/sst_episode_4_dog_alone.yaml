# Strange Situation Test - Episode 4 (Dog Alone).
#
# The robot is the dog, and it is left alone in the room for ~3 min. No people are
# present, so there are no actors at all: the human pool bodies stay parked off
# the arena and /sim/actors publishes an empty actor array. The room itself is
# unchanged - the chairs, door, water bowl and location markings are static world
# geometry in mecanumbot_sst.xml, and the building blocks remain as props.
#
# What to watch: /sim/actors is empty and scenario.subject_actor is None, so the
# detection evaluator reports `subject_missing` the whole episode. The cubes still
# appear on /sim/props. This is the baseline separation episode; in the real test
# it is curtailed if the dog is too distressed, which is a behaviour-side decision,
# not something the scene encodes.
#
# (Episode 6 is identical - a second dog-alone separation - and is shipped as its
# own file so each episode is a self-contained run.)
scenario:
  name: sst_episode_4_dog_alone
  actors: []
  props:
    # The blocks, left on Location 1 (1.5, -0.2).
    - id: 1
      name: block_a
      kind: cube
      body_name: sim_cube_0
      pose: {x: 1.45, y: -0.08, yaw: 0.0}
      size: 0.07
      mass: 0.15
    - id: 2
      name: block_b
      kind: cube
      body_name: sim_cube_1
      pose: {x: 1.55, y: -0.08, yaw: 0.0}
      size: 0.07
      mass: 0.15
    - id: 3
      name: block_c
      kind: cube
      body_name: sim_cube_2
      pose: {x: 1.45, y: -0.30, yaw: 0.0}
      size: 0.07
      mass: 0.15
    - id: 4
      name: block_d
      kind: cube
      body_name: sim_cube_3
      pose: {x: 1.55, y: -0.30, yaw: 0.0}
      size: 0.07
      mass: 0.15

    # A toy ball in the Toys area (top-centre of Fig. 1), between the two chairs.
    # A free body the dog (robot) can roll; size is the diameter.
    - id: 5
      name: toy_ball
      kind: ball
      body_name: sim_ball_0
      pose: {x: 0.1, y: 1.5, z: 0.0, yaw: 0.0}
      size: 0.18
      mass: 0.08
