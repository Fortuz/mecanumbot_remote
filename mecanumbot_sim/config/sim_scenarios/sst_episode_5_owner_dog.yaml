# Strange Situation Test - Episode 5 (Owner and Dog + Owner Leaving).
#
# The robot is the dog. sim_human_0 is the owner and the tracked subject. The
# owner enters, pauses next to the door without interacting (~5 s), greets the dog
# briefly (~5 s), then sits on Chair 1 and fills in the questionnaire for ~3 min,
# and at the end leaves the room quietly again.
#
# Simplifications: the ~5 s door pause and ~5 s greeting are short `pause` values;
# the greeting is the owner stepping up close to the robot and back. Minutes are
# shortened to seconds.
#
# What to watch: the subject reappears (the owner re-enters) after the Ep4
# separation, is tracked while in the room, and then leaves again - the final
# waypoint is south of the door (y < -2.2), so the subject goes missing at the end,
# which sets up the second separation in Ep6.
#
# Layout (mecanumbot_sst.xml): Chair 1 (-0.9, 0.7), door (0.3, -1.9), robot/dog
# near the origin, outside is y < -2.2.
scenario:
  name: sst_episode_5_owner_dog
  actors:
    - id: 1
      name: owner
      kind: human
      body_name: sim_human_0
      is_subject: true
      visible_to_lidar: true
      # Re-enters through the door, facing into the room.
      pose:
        x: 0.3
        y: -1.8
        z: 0.0
        yaw: 1.5707963267948966
      motion:
        mode: patrol
        speed: 0.35
        loop: false
        start_delay: 0.5
        waypoints:
          # Pause next to the door without interacting (~5 s).
          - {x: 0.3, y: -1.5, z: 0.0, pause: 2.5}
          # Greet the dog briefly: step up close to the robot (~5 s)...
          - {x: 0.2, y: -0.35, z: 0.0, pause: 2.5}
          # ... then sit on Chair 1 and fill in the questionnaire (~3 min).
          - {x: -0.75, y: 0.55, z: 0.0, pause: 22.5}
          # Leave the room quietly again, out through the door.
          - {x: 0.3, y: -1.75, z: 0.0}
          - {x: 0.3, y: -2.6, z: 0.0, pause: 15.0}

  props:
    # The blocks, left on Location 1 (1.5, -0.2).
    - id: 1
      name: block_a
      kind: cube
      body_name: sim_cube_0
      pose: {x: 1.45, y: -0.08, yaw: 0.0}
      size: 0.07
      mass: 0.15
    - id: 2
      name: block_b
      kind: cube
      body_name: sim_cube_1
      pose: {x: 1.55, y: -0.08, yaw: 0.0}
      size: 0.07
      mass: 0.15
    - id: 3
      name: block_c
      kind: cube
      body_name: sim_cube_2
      pose: {x: 1.45, y: -0.30, yaw: 0.0}
      size: 0.07
      mass: 0.15
    - id: 4
      name: block_d
      kind: cube
      body_name: sim_cube_3
      pose: {x: 1.55, y: -0.30, yaw: 0.0}
      size: 0.07
      mass: 0.15

    # A toy ball in the Toys area (top-centre of Fig. 1), between the two chairs.
    # A free body the dog (robot) can roll; size is the diameter.
    - id: 5
      name: toy_ball
      kind: ball
      body_name: sim_ball_0
      pose: {x: 0.1, y: 1.5, z: 0.0, yaw: 0.0}
      size: 0.18
      mass: 0.08
