# Strange Situation Test - Episode 6 (Dog Alone).
#
# A second separation episode, identical to Episode 4: the dog (the robot) is left
# alone in the room for ~3 min with no people present. No actors, so /sim/actors
# is empty and the pool humans stay parked off the arena; the room furniture and
# the building-block props are unchanged.
#
# Shipped as its own file (rather than reusing Episode 4) so each episode of the
# test is a self-contained run and can be launched by name in sequence.
#
# What to watch: `subject_missing` throughout, empty /sim/actors, cubes on
# /sim/props. Curtailed on distress in the real test - a behaviour-side decision.
scenario:
  name: sst_episode_6_dog_alone
  actors: []
  props:
